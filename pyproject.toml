[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv2latex-table"
version = "0.1.0"
description = "Convert CSV or Markdown tables into publication-ready LaTeX booktabs tables."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
csv2latex-table = "csv2latex_table.cli:main"

[tool.setuptools]
packages = ["csv2latex_table"]
